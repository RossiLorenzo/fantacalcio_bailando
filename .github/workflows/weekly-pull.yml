# Weekly pull of Bailando league scores into the season CSVs.
# Runs every Tuesday at 06:00 UTC (after the Serie A giornata ends on Monday).
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   FANTA_USER  - fantacalcio.it username
#   FANTA_PASS  - fantacalcio.it password
# Can also be triggered manually from the Actions tab (workflow_dispatch).

name: Weekly fantacalcio pull

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull season data from fantacalcio.it
        env:
          FANTA_USER: ${{ secrets.FANTA_USER }}
          FANTA_PASS: ${{ secrets.FANTA_PASS }}
        run: node scripts/pull_season.mjs "$FANTA_USER" "$FANTA_PASS"

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 20*/classifica.csv 20*/formazioni.csv 20*/matches.csv
          git diff --cached --quiet || git commit -m "Weekly fantacalcio data pull"
          git push
